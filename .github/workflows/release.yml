name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Build package
        run: make package

      - name: Attach build to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rebind.koplugin.zip
