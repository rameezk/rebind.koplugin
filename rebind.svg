<svg width="100%" viewBox="205 35 270 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Rebind plugin logo</title>
  <desc>A book wrapped by a circular refresh loop, representing rewriting a book's metadata.</desc>
  <style>
    .fill-ink      { fill: #1a1a1a; }
    .stroke-ink    { stroke: #1a1a1a; }
    .paper         { fill: #ffffff; }
    .stroke-accent { stroke: #3b82f6; }
    .stroke-muted  { stroke: #c2c0b6; }
    @media (prefers-color-scheme: dark) {
      .fill-ink      { fill: #e6e6e6; }
      .stroke-ink    { stroke: #e6e6e6; }
      .paper         { fill: #161b22; }
      .stroke-accent { stroke: #6ea8fe; }
      .stroke-muted  { stroke: #5c6370; }
    }
  </style>
  <defs>
    <marker id="rbhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="stroke-accent" d="M2 1L8 5L2 9" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g transform="translate(340,168)">
    <circle class="stroke-muted" cx="0" cy="0" r="118" fill="none" stroke-width="1" stroke-dasharray="2 6"/>

    <path class="stroke-accent" d="M 92 -34 A 98 98 0 1 1 34 -92" fill="none" stroke-width="9" stroke-linecap="round" marker-end="url(#rbhead)"/>
    <path class="stroke-accent" d="M -92 34 A 98 98 0 1 1 -34 92" fill="none" stroke-width="9" stroke-linecap="round" marker-end="url(#rbhead)"/>

    <g transform="translate(-52,-60)">
      <rect class="paper stroke-ink" x="0" y="0" width="104" height="120" rx="8" stroke-width="7"/>
      <line class="stroke-ink" x1="26" y1="0" x2="26" y2="120" stroke-width="7"/>
      <line class="stroke-ink" x1="46" y1="30" x2="86" y2="30" stroke-width="6" stroke-linecap="round"/>
      <line class="stroke-ink" x1="46" y1="52" x2="86" y2="52" stroke-width="6" stroke-linecap="round"/>
      <line class="stroke-ink" x1="46" y1="74" x2="72" y2="74" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <text class="fill-ink" fill="#1a1a1a" x="340" y="337" text-anchor="middle" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="2.5">REBIND</text>
</svg>
